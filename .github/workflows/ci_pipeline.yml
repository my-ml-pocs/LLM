name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DOCKER_REGISTRY: localhost:5000
      APP_NAME: myapp
      SONAR_URL: https://localhost
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SECURITY_SCAN_TOOL: trivy
      GIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout SCM
        uses: actions/checkout@v4

      - name: Setup PHP with Xdebug
        run: |
          sudo add-apt-repository ppa:ondrej/php -y
          sudo apt-get update
          sudo apt-get install -y php8.1 php8.1-cli php8.1-xml php8.1-xdebug composer
          php -v

      - name: Install dependencies with Composer
        run: composer update --no-ansi --no-interaction --no-progress

      - name: Run tests with PHPUnit
        run: vendor/bin/phpunit --coverage-clover=coverage.xml

      - name: Static Code Analysis
        run: sonar-scanner
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Quality Gate
        run: |
          sonar-scanner \
            -Dsonar.projectKey=myapp \
            -Dsonar.organization=myorg \
            -Dsonar.host.url=${SONAR_URL} \
            -Dsonar.login=${SONAR_TOKEN}
          echo "Quality gate handling must be implemented with Sonar API or official action"
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "SONAR_TOKEN is required"
            exit 1
          fi

      - name: Docker Build and Push
        run: |
          docker build -t ${DOCKER_REGISTRY}/${APP_NAME}:${GIT_SHA} .
          docker push ${DOCKER_REGISTRY}/${APP_NAME}:${GIT_SHA}

      - name: Security Scan
        run: ${SECURITY_SCAN_TOOL} image ${DOCKER_REGISTRY}/${APP_NAME}:${GIT_SHA}

      - name: Deploy
        run: |
          if [ -f helm/values.yaml ]; then
            helm upgrade --install ${APP_NAME} ./helm --set image.repository=${DOCKER_REGISTRY}/${APP_NAME} --set image.tag=${GIT_SHA}
          elif [ -f deployment.yaml ]; then
            kubectl apply -f deployment.yaml
          else
            echo "No deployment configuration found (helm/values.yaml or deployment.yaml)"
            exit 1
          fi

      - name: Rollback on failure
        if: failure()
        run: kubectl rollout undo deployment/${APP_NAME}